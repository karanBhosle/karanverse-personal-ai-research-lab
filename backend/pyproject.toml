[project]
name = "karanverse-research-lab-backend"
version = "0.1.0"
description = "Personal AI Research Lab — backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "docling>=2.0.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "neo4j>=5.26.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: integration tests that run Docling PDF conversion",
]
